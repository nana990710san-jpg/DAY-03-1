<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 동네 숨은 맛집</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    /* 디자인 토큰: 팔레트 → 역할. 다크 모드는 역할이 아니라 팔레트 값을 바꾼다 */
    :root {
      color-scheme: light dark;

      --gray-00: #ffffff;
      --gray-100: #f7f8f9;
      --gray-200: #f3f4f5;
      --gray-300: #eeeff1;
      --gray-400: #dcdee3;
      --gray-500: #d1d3d8;
      --gray-600: #b0b3ba;
      --gray-700: #868b94;
      --gray-800: #555d6d;
      --gray-1000: #1a1c20;
      --carrot-100: #fff2ec;
      --carrot-200: #ffe8db;
      --carrot-300: #ffd5c0;
      --carrot-600: #ff6600;
      --carrot-700: #e14d00;
      --red-100: #fdf0f0;
      --red-700: #fa342c;
      --blue-600: #5e98fe;
      --alpha-200: rgba(0, 0, 0, 0.047);
      --alpha-300: rgba(0, 0, 0, 0.063);

      --bg-layer-basement: var(--gray-200);
      --bg-layer-default: var(--gray-00);
      --bg-layer-fill: var(--gray-100);
      --bg-neutral-weak: var(--gray-200);
      --bg-neutral-weak-pressed: var(--gray-300);
      --bg-brand-solid: var(--carrot-600);
      --bg-brand-solid-pressed: var(--carrot-700);
      --bg-brand-weak: var(--carrot-100);
      --bg-brand-weak-pressed: var(--carrot-200);
      --bg-critical-weak: var(--red-100);
      --bg-disabled: var(--gray-200);
      --fg-neutral: var(--gray-1000);
      --fg-neutral-muted: var(--gray-800);
      --fg-neutral-subtle: var(--gray-700);
      --fg-neutral-inverted: var(--gray-00);
      --fg-placeholder: var(--gray-600);
      --fg-disabled: var(--gray-500);
      --fg-brand: var(--carrot-600);
      --fg-brand-contrast: var(--carrot-700);
      --fg-critical: var(--red-700);
      --stroke-neutral-weak: var(--gray-400);
      --stroke-neutral-muted: var(--alpha-300);
      --stroke-brand-weak: var(--carrot-300);
      --stroke-focus-ring: var(--blue-600);
      --star-off: var(--gray-400);

      --shadow-s1: 0 1px 4px rgba(0, 0, 0, 0.078);
      --scale-pressed: 0.97;
      --ease: cubic-bezier(0.35, 0, 0.35, 1);
      --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --gray-00: #000000;
        --gray-100: #16171b;
        --gray-200: #1d2025;
        --gray-300: #2b2e35;
        --gray-400: #393d46;
        --gray-500: #5b606a;
        --gray-600: #868b94;
        --gray-700: #b0b3ba;
        --gray-800: #dcdee3;
        --gray-1000: #f3f4f5;
        --carrot-100: #31241f;
        --carrot-200: #4b291c;
        --carrot-300: #6b311c;
        --carrot-600: #e65200;
        --carrot-700: #ff6600;
        --red-100: #322323;
        --red-700: #ff6e60;
        --blue-600: #1e82eb;
        --alpha-200: rgba(255, 255, 255, 0.125);
        --alpha-300: rgba(255, 255, 255, 0.09);

        /* 다크에서 달라지는 역할 대응 */
        --bg-layer-basement: var(--gray-00);
        --bg-layer-default: var(--gray-100);
        --bg-layer-fill: var(--gray-200);
        --bg-neutral-weak: var(--gray-300);
        --bg-neutral-weak-pressed: var(--gray-400);
        --bg-brand-solid: var(--carrot-700);
        --bg-brand-solid-pressed: #ff9e65;
        --bg-disabled: var(--gray-300);
        --fg-neutral-inverted: var(--gray-100);
        --fg-brand: var(--carrot-700);
        --fg-brand-contrast: var(--carrot-700);
        --shadow-s1: 0 1px 4px rgba(0, 0, 0, 0.502);
        --scale-pressed: 1;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg-layer-basement);
      color: var(--fg-neutral);
      font-family: var(--font);
      font-size: 16px;
      line-height: 22px;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    /* 반응형: 휴대폰·태블릿은 한 줄로 쌓고, PC(960px 이상)는 왼쪽 입력 폼 / 오른쪽 위 지도·아래 리뷰 */
    @media (min-width: 960px) {
      .wrap {
        max-width: 1200px;
        padding: 32px 32px 64px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(340px, 400px) 1fr;
        gap: 24px;
        align-items: start;
      }
      /* 오른쪽을 스크롤해도 입력 폼은 화면에 붙어 있게 */
      .col-form {
        position: sticky;
        top: 24px;
      }
      .col-side h2 { margin-top: 0; }
      .sec-list { margin-top: 32px; }
      .map-all { height: 420px; }
      .map-pick { height: 200px; }
      #list { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    }
    @media (min-width: 640px) and (max-width: 959px) {
      .wrap { max-width: 720px; padding: 32px 24px 56px; }
      .map-all { height: 360px; }
    }

    /* 상단 제목 */
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--fg-brand); }
    .home-link { color: inherit; text-decoration: none; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .account { flex-shrink: 0; padding-top: 2px; }
    .account [hidden] { display: none; }
    .chip-btn.login-link {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      background: var(--bg-brand-weak);
      color: var(--fg-brand-contrast);
    }
    .chip-btn.login-link:hover { background: var(--bg-brand-weak-pressed); }
    .me { display: inline-flex; align-items: center; gap: 8px; }
    .me-email {
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: var(--fg-neutral-muted);
    }
    @media (max-width: 420px) { .me-email { display: none; } }

    /* 로그인·회원가입 화면 */
    .auth-view[hidden], .layout[hidden], .login-prompt[hidden], #form[hidden], .field[hidden] { display: none; }
    .auth-card { max-width: 420px; margin: 8px auto 0; }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      margin-bottom: 20px;
      border-radius: 12px;
      background: var(--bg-neutral-weak);
    }
    .auth-tab {
      height: 40px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--fg-neutral-subtle);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-tab[aria-selected="true"] {
      background: var(--bg-layer-default);
      color: var(--fg-neutral);
      box-shadow: var(--shadow-s1);
    }
    .auth-tab:focus-visible { outline: 2px solid var(--stroke-focus-ring); outline-offset: 2px; }
    #auth-msg.ok { color: var(--fg-brand-contrast); }
    .auth-foot { margin: 12px 0 0; text-align: center; font-size: 14px; }
    .auth-foot a { color: var(--fg-neutral-subtle); }
    .login-prompt-title { margin: 0 0 6px; font-size: 16px; line-height: 22px; font-weight: 700; }
    .login-prompt-text { margin: 0 0 16px; font-size: 14px; line-height: 20px; color: var(--fg-neutral-subtle); }
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .sub {
      margin: 6px 0 20px;
      color: var(--fg-neutral-subtle);
      font-size: 14px;
      line-height: 19px;
    }
    .note {
      margin: 0 0 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bg-critical-weak);
      color: var(--fg-critical);
      font-size: 14px;
      line-height: 19px;
    }
    .note[hidden] { display: none; }

    /* 표면: 깊이는 색으로, 그림자는 아주 옅게 */
    .card {
      background: var(--bg-layer-default);
      border-radius: 16px;
      box-shadow: var(--shadow-s1);
      padding: 20px 16px;
    }

    /* 입력 필드 */
    form .field { margin-bottom: 20px; }
    label, .label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      line-height: 19px;
      font-weight: 700;
      color: var(--fg-neutral);
    }
    .req { color: var(--fg-brand); margin-left: 2px; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--stroke-neutral-weak);
      border-radius: 10px;
      background: var(--bg-layer-default);
      color: var(--fg-neutral);
      font-size: 16px;
      font-family: inherit;
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }
    input::placeholder { color: var(--fg-placeholder); }
    input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--fg-neutral);
      box-shadow: inset 0 0 0 1px var(--fg-neutral);
    }
    .count {
      font-size: 13px;
      line-height: 18px;
      color: var(--fg-neutral-subtle);
    }
    .review-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    /* 버튼 공통: 누르면 살짝 작아짐 */
    .btn, .ai-btn, .reply-btn, .del {
      border: 0;
      cursor: pointer;
      font-weight: 700;
      transition: background-color 150ms var(--ease), transform 150ms cubic-bezier(0, 0, 0.15, 1);
    }
    .btn:active, .ai-btn:active, .reply-btn:active, .del:active { transform: scale(var(--scale-pressed)); }
    .btn:focus-visible, .ai-btn:focus-visible, .reply-btn:focus-visible, .del:focus-visible {
      outline: 2px solid var(--stroke-focus-ring);
      outline-offset: 2px;
    }
    .btn:disabled, .ai-btn:disabled, .reply-btn:disabled, .del:disabled {
      background: var(--bg-disabled);
      color: var(--fg-disabled);
      cursor: default;
      transform: none;
    }

    /* 보조 버튼(약한 브랜드): AI 한줄평 추천 */
    .ai-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 9999px;
      background: var(--bg-brand-weak);
      color: var(--fg-brand-contrast);
      font-size: 14px;
    }
    .ai-btn:hover { background: var(--bg-brand-weak-pressed); }

    /* 다른 고객님들의 의견: 이 앱에 실제로 등록된 같은 메뉴·식당 한줄평 */
    .others {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-layer-fill);
      box-shadow: inset 0 0 0 1px var(--stroke-neutral-muted);
    }
    .others[hidden] { display: none; }
    .others-title {
      margin: 0 0 6px;
      font-size: 13px;
      line-height: 18px;
      font-weight: 700;
      color: var(--fg-brand-contrast);
    }
    .others-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 6px;
    }
    .others-list li {
      font-size: 13px;
      line-height: 18px;
      color: var(--fg-neutral-muted);
      word-break: break-all;
    }
    .others-list .o-stars { color: var(--fg-brand); margin-right: 4px; }
    .others-list .o-where { color: var(--fg-neutral-subtle); font-size: 12px; }
    .others-empty { color: var(--fg-neutral-subtle); }

    /* 지도: 입력 폼의 위치 찍기 지도 + 전체 맛집 지도 */
    .map {
      position: relative;
      z-index: 0;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-layer-fill);
      box-shadow: inset 0 0 0 1px var(--stroke-neutral-muted);
    }
    .map-all {
      height: 320px;
      border-radius: 16px;
      box-shadow: var(--shadow-s1);
    }
    .map .leaflet-container { font-family: var(--font); }
    .loc-help {
      margin: 0 0 8px;
      font-size: 13px;
      line-height: 18px;
      color: var(--fg-neutral-subtle);
    }
    .loc-help.set { color: var(--fg-brand-contrast); font-weight: 700; }
    .loc-tools {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .chip-btn {
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 9999px;
      background: var(--bg-neutral-weak);
      color: var(--fg-neutral);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 150ms var(--ease), transform 150ms cubic-bezier(0, 0, 0.15, 1);
    }
    .chip-btn:hover { background: var(--bg-neutral-weak-pressed); }
    .chip-btn:active { transform: scale(var(--scale-pressed)); }
    .chip-btn:focus-visible { outline: 2px solid var(--stroke-focus-ring); outline-offset: 2px; }
    .chip-btn[hidden] { display: none; }
    .map-empty {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 18px;
      color: var(--fg-neutral-subtle);
    }
    .map-empty[hidden] { display: none; }
    /* 주황 물방울 핀 */
    .pin-wrap { background: none; border: 0; }
    .pin {
      display: block;
      width: 26px;
      height: 26px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 0;
      background: var(--bg-brand-solid);
      transform: rotate(-45deg);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    .pop strong { display: block; font-size: 14px; }
    .pop .pop-stars { color: #ff6600; font-size: 12px; }
    .pop .pop-text { margin-top: 4px; font-size: 13px; color: #555d6d; }

    /* 별점: 라디오 5개를 거꾸로 배치해 hover/선택 시 왼쪽 별까지 채움 */
    .stars {
      display: inline-flex;
      flex-direction: row-reverse;
      gap: 2px;
      border: 0;
      padding: 0;
      margin: 0;
    }
    .stars input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }
    .stars label {
      margin: 0;
      padding: 2px 3px;
      font-size: 32px;
      line-height: 1;
      font-weight: normal;
      color: var(--star-off);
      cursor: pointer;
      transition: color 150ms var(--ease);
    }
    .stars input:checked ~ label,
    .stars label:hover,
    .stars label:hover ~ label {
      color: var(--fg-brand);
    }
    .stars input:focus-visible + label {
      outline: 2px solid var(--stroke-focus-ring);
      border-radius: 6px;
    }

    /* 주요 액션(CTA): 브랜드 단색 + 흰 글자 + 완전 둥근 모서리 */
    .btn {
      width: 100%;
      height: 52px;
      border-radius: 9999px;
      background: var(--bg-brand-solid);
      color: var(--fg-neutral-inverted);
      font-size: 16px;
    }
    .btn:hover { background: var(--bg-brand-solid-pressed); }
    .msg {
      min-height: 19px;
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 19px;
      color: var(--fg-critical);
    }

    /* 목록 */
    h2 {
      margin: 32px 0 12px;
      font-size: 18px;
      line-height: 24px;
      font-weight: 700;
    }
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }
    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .item-name {
      margin: 0;
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      word-break: break-all;
    }
    .item-stars {
      color: var(--fg-brand);
      white-space: nowrap;
      font-size: 14px;
      line-height: 22px;
      letter-spacing: 1px;
    }
    .item-stars .off { color: var(--star-off); }
    .item-menu {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-neutral-weak);
      color: var(--fg-neutral-muted);
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      word-break: break-all;
    }
    .item-review {
      margin: 10px 0 0;
      font-size: 15px;
      line-height: 22px;
      color: var(--fg-neutral);
      word-break: break-all;
    }

    /* 사장님 답글: 한 단계 안쪽 표면 */
    .reply {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg-layer-fill);
    }
    .reply-pending {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .reply-label {
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      color: var(--fg-brand-contrast);
    }
    .reply-text {
      margin: 4px 0 0;
      font-size: 14px;
      line-height: 20px;
      color: var(--fg-neutral-muted);
      word-break: break-all;
    }
    .reply-btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 9999px;
      background: var(--bg-layer-default);
      box-shadow: inset 0 0 0 1px var(--stroke-neutral-weak);
      color: var(--fg-neutral);
      font-size: 13px;
    }
    .reply-btn:hover { background: var(--bg-neutral-weak); }
    .reply-error {
      font-size: 12px;
      line-height: 16px;
      color: var(--fg-critical);
    }

    .item-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--stroke-neutral-muted);
      font-size: 13px;
      line-height: 18px;
      color: var(--fg-neutral-subtle);
    }
    .del {
      height: 32px;
      min-width: 52px;
      padding: 0 12px;
      border-radius: 8px;
      background: var(--bg-neutral-weak);
      color: var(--fg-neutral-muted);
      font-size: 13px;
    }
    .del:hover { background: var(--bg-neutral-weak-pressed); }
    .foot-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .empty {
      text-align: center;
      color: var(--fg-neutral-subtle);
      padding: 40px 16px;
      font-size: 14px;
      line-height: 19px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1><a href="#" class="home-link">🍜 우리 동네 <span>숨은 맛집</span></a></h1>
        <p class="sub">가 본 맛집을 기록하고 함께 봐요</p>
      </div>
      <div class="account" id="account">
        <a href="#login" class="chip-btn login-link" id="login-link">로그인</a>
        <span class="me" id="me" hidden>
          <span class="me-email" id="me-email"></span>
          <button type="button" class="chip-btn" id="logout-btn">로그아웃</button>
        </span>
      </div>
    </header>
    <p class="note" id="notice" role="status" hidden></p>

    <!-- 로그인·회원가입 화면 (#login) -->
    <section class="auth-view" id="auth-view" hidden>
      <div class="card auth-card">
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab" id="tab-login" role="tab" aria-selected="true">로그인</button>
          <button type="button" class="auth-tab" id="tab-signup" role="tab" aria-selected="false">회원가입</button>
        </div>
        <form id="auth-form" novalidate>
          <div class="field">
            <label for="auth-email">이메일</label>
            <input type="email" id="auth-email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="auth-password">비밀번호</label>
            <input type="password" id="auth-password" autocomplete="current-password" placeholder="6자 이상" minlength="6" required>
          </div>
          <div class="field" id="confirm-field" hidden>
            <label for="auth-password2">비밀번호 확인</label>
            <input type="password" id="auth-password2" autocomplete="new-password" placeholder="한 번 더 입력해 주세요">
          </div>
          <button type="submit" class="btn" id="auth-submit">로그인</button>
          <p class="msg" id="auth-msg" role="alert"></p>
        </form>
        <p class="auth-foot"><a href="#">← 로그인 없이 맛집 구경하기</a></p>
      </div>
    </section>

    <div class="layout" id="main-view">
    <div class="col-form">
    <div class="card login-prompt" id="login-prompt" hidden>
      <p class="login-prompt-title">맛집을 기록하려면 로그인해 주세요 🙌</p>
      <p class="login-prompt-text">로그인하지 않아도 지도와 리뷰는 마음껏 볼 수 있어요. 기록·삭제·AI 추천은 회원만 쓸 수 있어요.</p>
      <a href="#login" class="btn btn-link">로그인 / 회원가입</a>
    </div>
    <form id="form" class="card" novalidate>
      <div class="field">
        <label for="name">식당 이름 <span class="req">*</span></label>
        <input type="text" id="name" maxlength="30" placeholder="예: 골목 칼국수" autocomplete="off">
      </div>
      <div class="field">
        <label for="menu">메뉴</label>
        <input type="text" id="menu" maxlength="30" placeholder="예: 바지락 칼국수" autocomplete="off">
      </div>
      <div class="field">
        <span class="label" id="rating-label">별점 <span class="req">*</span></span>
        <fieldset class="stars" aria-labelledby="rating-label">
          <input type="radio" name="rating" id="r5" value="5"><label for="r5" title="5점">★</label>
          <input type="radio" name="rating" id="r4" value="4"><label for="r4" title="4점">★</label>
          <input type="radio" name="rating" id="r3" value="3"><label for="r3" title="3점">★</label>
          <input type="radio" name="rating" id="r2" value="2"><label for="r2" title="2점">★</label>
          <input type="radio" name="rating" id="r1" value="1"><label for="r1" title="1점">★</label>
        </fieldset>
      </div>
      <div class="field">
        <label for="review">한줄평</label>
        <input type="text" id="review" maxlength="100" placeholder="예: 국물이 진하고 면이 쫄깃해요" autocomplete="off">
        <div class="review-tools">
          <button type="button" class="ai-btn" id="ai-btn">✨ AI 한줄평 추천</button>
          <div class="count"><span id="review-count">0</span>/100</div>
        </div>
        <div class="others" id="others" hidden>
          <p class="others-title">💬 다른 고객님들의 의견이에요!</p>
          <ul class="others-list" id="others-list"></ul>
        </div>
      </div>
      <div class="field">
        <span class="label" id="loc-label">위치</span>
        <p class="loc-help" id="loc-help">지도를 눌러 맛집 위치를 찍어 주세요 (선택)</p>
        <div class="map map-pick" id="pick-map" role="application" aria-labelledby="loc-label"></div>
        <div class="loc-tools">
          <button type="button" class="chip-btn" id="loc-me">📍 내 위치로</button>
          <button type="button" class="chip-btn" id="loc-clear" hidden>위치 지우기</button>
        </div>
      </div>
      <button type="submit" class="btn">추가</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>

    </div>

    <!-- PC: 오른쪽 위 지도, 오른쪽 아래 리뷰 / 휴대폰: 폼 아래로 차례대로 -->
    <div class="col-side">
      <section class="sec-map">
        <h2 id="map-title">맛집 지도</h2>
        <div class="map map-all" id="all-map" role="application" aria-labelledby="map-title"></div>
        <p class="map-empty" id="map-empty">위치를 찍은 맛집이 여기 핀으로 보여요.</p>
      </section>
      <section class="sec-list">
        <h2>등록된 맛집</h2>
        <ul id="list"></ul>
      </section>
    </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://lyiohwpsobsywrycaelc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_KTBSa_LsTZwtp4jidkcweA_tPZzd_H7';
    const LIMITS = { name: 30, menu: 30, review: 100 };

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let myId = null;
    let items = [];

    const form = document.getElementById('form');
    const nameInput = document.getElementById('name');
    const menuInput = document.getElementById('menu');
    const reviewInput = document.getElementById('review');
    const reviewCount = document.getElementById('review-count');
    const msg = document.getElementById('msg');
    const list = document.getElementById('list');
    const submitBtn = form.querySelector('button[type="submit"]');

    function showNotice(text) {
      const note = document.getElementById('notice');
      note.textContent = text;
      note.hidden = !text;
    }

    // ── 로그인 (이메일 + 비밀번호) ──
    // 이메일로 로그인한 회원만 추가·삭제·AI를 쓸 수 있고, 그 밖의 방문자는 보기만 한다
    let myEmail = null;

    function setUser(user) {
      const member = user && !user.is_anonymous ? user : null;
      myId = member ? member.id : null;
      myEmail = member ? member.email : null;
      document.getElementById('login-link').hidden = !!member;
      document.getElementById('me').hidden = !member;
      document.getElementById('me-email').textContent = myEmail ?? '';
      document.getElementById('login-prompt').hidden = !!member;
      form.hidden = !member;
    }

    // 주소가 #login 이면 로그인 화면, 아니면 맛집 화면
    function route() {
      const onLogin = location.hash === '#login';
      document.getElementById('auth-view').hidden = !onLogin;
      document.getElementById('main-view').hidden = onLogin;
      document.getElementById('account').style.visibility = onLogin ? 'hidden' : '';
      if (onLogin && myId) {
        location.hash = '';
        return;
      }
      if (onLogin) {
        authMsg.textContent = '';
        authEmail.focus();
      } else {
        // 숨겨져 있던 지도가 다시 보이면 크기를 다시 잡아야 타일이 제대로 그려진다
        setTimeout(() => { pickMap.invalidateSize(); allMap.invalidateSize(); }, 0);
      }
    }

    const authForm = document.getElementById('auth-form');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authPassword2 = document.getElementById('auth-password2');
    const authSubmit = document.getElementById('auth-submit');
    const authMsg = document.getElementById('auth-msg');
    let authMode = 'login';

    function setAuthMode(mode) {
      authMode = mode;
      document.getElementById('tab-login').setAttribute('aria-selected', String(mode === 'login'));
      document.getElementById('tab-signup').setAttribute('aria-selected', String(mode === 'signup'));
      document.getElementById('confirm-field').hidden = mode !== 'signup';
      authPassword.autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
      authSubmit.textContent = mode === 'signup' ? '회원가입' : '로그인';
      authMsg.textContent = '';
      authMsg.classList.remove('ok');
    }
    document.getElementById('tab-login').addEventListener('click', () => setAuthMode('login'));
    document.getElementById('tab-signup').addEventListener('click', () => setAuthMode('signup'));

    function authErrorText(error) {
      const m = (error?.message ?? '').toLowerCase();
      if (m.includes('invalid login credentials')) return '이메일 또는 비밀번호가 맞지 않아요.';
      if (m.includes('email not confirmed')) return '아직 이메일 확인 전이에요. 받은 메일의 링크를 먼저 눌러 주세요.';
      if (m.includes('already registered') || m.includes('already been registered')) return '이미 가입된 이메일이에요. 로그인해 주세요.';
      if (m.includes('password')) return '비밀번호는 6자 이상으로 해 주세요.';
      if (m.includes('rate limit') || m.includes('too many')) return '요청이 너무 많아요. 잠시 후 다시 시도해 주세요.';
      if (m.includes('email')) return '이메일 주소를 다시 확인해 주세요.';
      return '잠시 문제가 생겼어요. 다시 시도해 주세요.';
    }

    authForm.addEventListener('submit', async e => {
      e.preventDefault();
      authMsg.textContent = '';
      authMsg.classList.remove('ok');
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!/^\S+@\S+\.\S+$/.test(email)) {
        authMsg.textContent = '이메일 주소를 정확히 입력해 주세요.';
        authEmail.focus();
        return;
      }
      if (password.length < 6) {
        authMsg.textContent = '비밀번호는 6자 이상으로 해 주세요.';
        authPassword.focus();
        return;
      }
      if (authMode === 'signup' && password !== authPassword2.value) {
        authMsg.textContent = '비밀번호 확인이 달라요. 다시 입력해 주세요.';
        authPassword2.focus();
        return;
      }

      authSubmit.disabled = true;
      const result = authMode === 'signup'
        ? await db.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } })
        : await db.auth.signInWithPassword({ email, password });
      authSubmit.disabled = false;

      if (result.error) {
        authMsg.textContent = authErrorText(result.error);
        return;
      }
      authForm.reset();
      if (authMode === 'signup' && !result.data.session) {
        // 이메일 확인이 켜져 있으면 메일의 링크를 눌러야 가입이 끝난다
        setAuthMode('login');
        authMsg.classList.add('ok');
        authMsg.textContent = `${email}로 확인 메일을 보냈어요! 메일의 링크를 누른 뒤 로그인해 주세요.`;
        return;
      }
      location.hash = '';
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
    });

    async function load() {
      const { data, error } = await db
        .from('restaurants')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) throw error;
      items = data;
    }

    async function refresh() {
      try {
        await load();
        showNotice('');
      } catch (err) {
        console.error(err);
        showNotice('목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.');
      }
      render();
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function render() {
      renderMap();
      list.replaceChildren();

      if (items.length === 0) {
        list.append(el('li', 'card empty', '아직 등록된 맛집이 없어요. 첫 맛집을 기록해 보세요!'));
        return;
      }

      for (const item of items) {
        const li = el('li', 'card');

        const head = el('div', 'item-head');
        head.append(el('p', 'item-name', item.name));
        const stars = el('span', 'item-stars');
        stars.setAttribute('aria-label', `별점 ${item.rating}점`);
        stars.append('★'.repeat(item.rating));
        stars.append(el('span', 'off', '★'.repeat(5 - item.rating)));
        head.append(stars);
        li.append(head);

        if (item.menu) li.append(el('span', 'item-menu', item.menu));
        if (item.review) li.append(el('p', 'item-review', `“${item.review}”`));
        const reply = renderReply(item);
        if (reply) li.append(reply);

        const foot = el('div', 'item-foot');
        foot.append(el('span', null, formatDate(item.created_at)));
        const actions = el('div', 'foot-actions');
        if (item.lat != null && item.lng != null) {
          const mapBtn = el('button', 'chip-btn', '📍 지도에서 보기');
          mapBtn.type = 'button';
          mapBtn.addEventListener('click', () => showOnMap(item.id));
          actions.append(mapBtn);
        }
        if (item.user_id === myId) {
          const del = el('button', 'del', '삭제');
          del.type = 'button';
          del.addEventListener('click', () => removeItem(item.id, item.name, del));
          actions.append(del);
        }
        foot.append(actions);
        li.append(foot);

        list.append(li);
      }
    }

    // ── 지도 (OpenStreetMap + Leaflet, 키 없이 무료) ──
    const DEFAULT_CENTER = [37.5665, 126.978]; // 위치가 하나도 없을 때: 서울시청
    const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    const TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';

    function pinIcon() {
      return L.divIcon({
        className: 'pin-wrap',
        html: '<span class="pin"></span>',
        iconSize: [26, 26],
        iconAnchor: [13, 30],
        popupAnchor: [0, -28],
      });
    }

    function makeMap(id, zoom) {
      const map = L.map(id, { scrollWheelZoom: false }).setView(DEFAULT_CENTER, zoom);
      L.tileLayer(TILE_URL, { maxZoom: 19, attribution: TILE_ATTR }).addTo(map);
      return map;
    }

    // 입력 폼: 지도를 눌러 위치 찍기
    const pickMap = makeMap('pick-map', 14);
    const locHelp = document.getElementById('loc-help');
    const locClear = document.getElementById('loc-clear');
    let picked = null;
    let pickMarker = null;

    function setPicked(latlng) {
      picked = latlng ? { lat: Number(latlng.lat.toFixed(6)), lng: Number(latlng.lng.toFixed(6)) } : null;
      if (pickMarker) pickMarker.remove();
      pickMarker = picked ? L.marker(picked, { icon: pinIcon() }).addTo(pickMap) : null;
      locHelp.textContent = picked ? '📍 위치를 찍었어요! 다시 누르면 옮길 수 있어요.' : '지도를 눌러 맛집 위치를 찍어 주세요 (선택)';
      locHelp.classList.toggle('set', !!picked);
      locClear.hidden = !picked;
    }

    pickMap.on('click', e => setPicked(e.latlng));
    locClear.addEventListener('click', () => setPicked(null));
    document.getElementById('loc-me').addEventListener('click', () => {
      if (!navigator.geolocation) {
        msg.textContent = '이 브라우저에서는 내 위치를 쓸 수 없어요. 지도를 직접 눌러 주세요.';
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          pickMap.setView(here, 17);
          setPicked(here);
        },
        () => { msg.textContent = '내 위치를 가져오지 못했어요. 지도를 직접 눌러 주세요.'; },
        { enableHighAccuracy: true, timeout: 10000 },
      );
    });

    // 전체 맛집 지도: 위치가 있는 기록을 핀으로
    const allMap = makeMap('all-map', 13);
    const markerLayer = L.layerGroup().addTo(allMap);
    const markers = new Map();
    const mapEmpty = document.getElementById('map-empty');
    let mapFitted = false;

    function renderMap() {
      markerLayer.clearLayers();
      markers.clear();
      const located = items.filter(i => i.lat != null && i.lng != null);
      for (const item of located) {
        const pop = el('div', 'pop');
        pop.append(el('strong', null, item.name));
        pop.append(el('div', 'pop-stars', '★'.repeat(item.rating)));
        if (item.menu) pop.append(el('div', 'pop-text', item.menu));
        if (item.review) pop.append(el('div', 'pop-text', `“${item.review}”`));
        const marker = L.marker([item.lat, item.lng], { icon: pinIcon(), title: item.name }).bindPopup(pop);
        markerLayer.addLayer(marker);
        markers.set(item.id, marker);
      }
      mapEmpty.hidden = located.length > 0;
      // 처음 한 번만 모든 핀이 보이게 맞춘다(그 뒤엔 사용자가 옮긴 화면 유지)
      if (located.length && !mapFitted) {
        allMap.fitBounds(located.map(i => [i.lat, i.lng]), { padding: [40, 40], maxZoom: 16 });
        mapFitted = true;
      }
    }

    function showOnMap(id) {
      const marker = markers.get(id);
      if (!marker) return;
      document.getElementById('map-title').scrollIntoView({ behavior: 'smooth' });
      allMap.setView(marker.getLatLng(), 17);
      marker.openPopup();
    }

    // 사장님 답글: 한줄평이 있는 기록에만. 답글은 Edge Function만 저장할 수 있다
    const replying = new Set();
    const replyFailed = new Set();

    function renderReply(item) {
      if (!item.review) return null;
      const box = el('div', 'reply');
      if (item.owner_reply) {
        box.append(el('span', 'reply-label', '사장님 답글'));
        box.append(el('p', 'reply-text', item.owner_reply));
        return box;
      }
      if (replying.has(item.id)) {
        box.classList.add('reply-pending');
        box.append(el('span', 'reply-label', '사장님이 답글을 쓰는 중…'));
        return box;
      }
      if (item.user_id !== myId) return null;
      box.classList.add('reply-pending');
      const btn = el('button', 'reply-btn', '사장님 답글 받기');
      btn.type = 'button';
      btn.addEventListener('click', () => requestReply(item.id));
      box.append(btn);
      if (replyFailed.has(item.id)) box.append(el('span', 'reply-error', '답글을 받지 못했어요. 다시 눌러 주세요.'));
      return box;
    }

    async function requestReply(id) {
      replying.add(id);
      replyFailed.delete(id);
      render();
      const { data, error } = await db.functions.invoke('suggest-review', { body: { mode: 'reply', id } });
      replying.delete(id);
      if (error || !data?.reply) {
        console.error(error);
        replyFailed.add(id);
      }
      await refresh();
    }

    async function removeItem(id, name, button) {
      if (!confirm(`'${name}' 기록을 삭제할까요?`)) return;
      button.disabled = true;
      const { error } = await db.from('restaurants').delete().eq('id', id);
      if (error) {
        console.error(error);
        alert('삭제하지 못했어요. 다시 시도해 주세요.');
        button.disabled = false;
        return;
      }
      await refresh();
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.textContent = '';

      const name = nameInput.value.trim();
      const menu = menuInput.value.trim();
      const review = reviewInput.value.trim();
      const checked = form.querySelector('input[name="rating"]:checked');
      const rating = checked ? Number(checked.value) : 0;

      if (!name) {
        msg.textContent = '식당 이름을 입력해 주세요.';
        nameInput.focus();
        return;
      }
      if (name.length > LIMITS.name || menu.length > LIMITS.menu || review.length > LIMITS.review) {
        msg.textContent = '글자 수가 너무 많아요.';
        return;
      }
      if (!(rating >= 1 && rating <= 5)) {
        msg.textContent = '별점을 골라 주세요.';
        return;
      }

      if (!myId) {
        msg.textContent = '로그인해야 맛집을 기록할 수 있어요.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '추가 중…';
      const { data: added, error } = await db.from('restaurants').insert({
        name,
        menu: menu || null,
        rating,
        review: review || null,
        lat: picked ? picked.lat : null,
        lng: picked ? picked.lng : null,
      }).select('id').single();
      submitBtn.disabled = false;
      submitBtn.textContent = '추가';

      if (error) {
        console.error(error);
        msg.textContent = '저장하지 못했어요. 다시 시도해 주세요.';
        return;
      }

      form.reset();
      reviewCount.textContent = '0';
      othersBox.hidden = true;
      const addedPlace = picked;
      setPicked(null);
      nameInput.focus();
      if (review) replying.add(added.id);
      await refresh();
      // 방금 위치를 찍은 맛집은 전체 지도에서 바로 보이게
      if (addedPlace) allMap.setView(addedPlace, Math.max(allMap.getZoom(), 15));
      if (review) requestReply(added.id);
    });

    // 다른 고객님들의 의견: 함수가 찾아 준 실제 한줄평만 보여 준다(AI가 지어낸 문장은 넣지 않음)
    const othersBox = document.getElementById('others');
    const othersList = document.getElementById('others-list');

    function showOthers(others) {
      othersList.replaceChildren();
      if (!Array.isArray(others)) {
        othersBox.hidden = true;
        return;
      }
      if (others.length === 0) {
        othersList.append(el('li', 'others-empty', '아직 이 메뉴를 남긴 고객님이 없어요. 첫 후기의 주인공이 되어 주세요!'));
      }
      for (const o of others) {
        const li = el('li');
        li.append(el('span', 'o-stars', '★'.repeat(o.rating)));
        li.append(`“${o.review}” `);
        li.append(el('span', 'o-where', `· ${o.name}${o.menu ? ` ${o.menu}` : ''}`));
        othersList.append(li);
      }
      othersBox.hidden = false;
    }

    const aiBtn = document.getElementById('ai-btn');
    aiBtn.addEventListener('click', async () => {
      msg.textContent = '';
      const name = nameInput.value.trim();
      if (!name) {
        msg.textContent = 'AI 추천을 받으려면 식당 이름을 먼저 입력해 주세요.';
        nameInput.focus();
        return;
      }
      const checked = form.querySelector('input[name="rating"]:checked');

      aiBtn.disabled = true;
      aiBtn.textContent = '추천 중…';
      let { data, error } = await db.functions.invoke('suggest-review', {
        body: {
          name,
          menu: menuInput.value.trim(),
          rating: checked ? Number(checked.value) : null,
        },
      });
      aiBtn.disabled = false;
      aiBtn.textContent = '✨ AI 한줄평 추천';

      // 추천 문장을 못 만들어도 다른 고객님 의견은 보여 준다
      if (error && !data) data = await error.context?.json?.().catch(() => null);
      showOthers(data?.others);

      if (error || !data?.review) {
        console.error(error);
        msg.textContent = '추천을 가져오지 못했어요. 잠시 후 다시 눌러 주세요.';
        return;
      }
      reviewInput.value = data.review.slice(0, LIMITS.review);
      reviewCount.textContent = reviewInput.value.length;
    });

    reviewInput.addEventListener('input', () => {
      reviewCount.textContent = reviewInput.value.length;
    });

    (async () => {
      list.replaceChildren(el('li', 'card empty', '불러오는 중…'));
      const { data: { session } } = await db.auth.getSession();
      // 예전 버전이 만든 익명 세션은 회원이 아니므로 정리한다
      if (session?.user?.is_anonymous) await db.auth.signOut({ scope: 'local' });
      setUser(session?.user?.is_anonymous ? null : session?.user);
      route();
      await refresh();

      // 로그인·로그아웃·이메일 확인 링크로 돌아왔을 때 화면을 맞춘다
      db.auth.onAuthStateChange((event, newSession) => {
        const before = myId;
        setUser(newSession?.user);
        if (before !== myId) {
          route();
          render();
        }
      });
    })();
    window.addEventListener('hashchange', route);
  </script>
</body>
</html>
